<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>執行紀錄 — EdgeSec Lab</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .page { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.3rem; color: var(--lab-brand); margin-bottom: 0.25rem; }
    .run-meta { color: var(--text-dim); font-size: 0.82rem; margin-bottom: 1rem; font-family: var(--font-mono); }

    .status-success  { color: var(--green); }
    .status-failed, .status-error, .status-timeout { color: var(--red); }
    .status-running, .status-starting { color: var(--blue); }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1rem;
      align-items: start;
    }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    .section-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.75rem; }

    .step {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      margin-bottom: 0.6rem;
    }
    .step-head { display: flex; align-items: baseline; gap: 0.5rem; font-size: 0.85rem; }
    .step-head .step-name { flex-grow: 1; color: var(--text-main); }
    .step-exit-ok  { color: var(--green); }
    .step-exit-bad { color: var(--red); }
    .step-duration { color: var(--text-muted); font-size: 0.72rem; }
    .step pre {
      margin-top: 0.5rem;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 0.78rem;
      color: var(--text-dim);
      max-height: 150px;
      overflow-y: auto;
    }

    .step-trace {
      margin-top: 0.5rem;
      font-size: 0.74rem;
      color: var(--text-muted);
    }
    .step-trace summary {
      cursor: pointer;
      color: var(--cyan);
    }
    .step-trace ul { margin: 0.3rem 0 0 1.1rem; padding: 0; }
    .step-trace li { font-family: var(--font-mono); word-break: break-all; }

    .result-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      display: none;
    }
    .result-box.show { display: block; }
    .result-row { display: flex; justify-content: space-between; padding: 0.2rem 0; }
    .result-row .label { color: var(--text-muted); }
    .flag-val { font-family: monospace; color: var(--cyan); }

    /* ── Step 狀態 ── */
    .step { transition: border-color 0.2s; }
    .step.step-done-ok  { border-color: rgba(57,255,20,0.35); }
    .step.step-done-bad { border-color: rgba(248,81,73,0.4); }
    .step.step-running  { border-color: var(--lab-border); }
    .step-num {
      font-size: 0.68rem; color: var(--text-muted);
      font-family: var(--font-mono); min-width: 1.4em; flex-shrink: 0;
    }
    .step-icon { font-size: 0.85rem; flex-shrink: 0; line-height: 1; }
    .steps-count { font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); }

    /* ── Alert 嚴重性 ── */
    .alert-item {
      border-left: 3px solid var(--orange);
      padding: 0.4rem 0.6rem;
      margin-bottom: 0.5rem;
      font-size: 0.78rem;
      background: var(--bg-hover);
      border-radius: 0 6px 6px 0;
    }
    .alert-item.sev-critical { border-left-color: var(--red); }
    .alert-item.sev-critical .alert-rule { color: var(--red); }
    .alert-item.sev-warning  { border-left-color: var(--orange); }
    .alert-item.sev-warning  .alert-rule { color: var(--orange); }
    .alert-item.sev-notice   { border-left-color: var(--blue); }
    .alert-item.sev-notice   .alert-rule { color: var(--blue); }
    .alert-item.sev-info     { border-left-color: var(--text-muted); }
    .alert-item.sev-info     .alert-rule { color: var(--text-dim); }

    .alert-header {
      display: flex; align-items: baseline;
      justify-content: space-between; gap: 0.5rem;
    }
    .alert-rule { font-weight: 700; }
    .alert-time {
      font-size: 0.68rem; color: var(--text-muted);
      font-family: var(--font-mono); flex-shrink: 0;
    }
    .alert-sev {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.5px;
      opacity: 0.7; margin-bottom: 0.12rem; display: block;
    }
    .alert-output { color: var(--text-dim); margin-top: 0.2rem; word-break: break-all; }
    .empty-hint { color: var(--text-muted); font-size: 0.82rem; }

    /* result-summary ri- elements */
    .ri-label { font-size: 0.72rem; color: var(--text-muted); display: block; margin-bottom: 0.2rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .ri-value { font-size: 0.88rem; color: var(--text-main); display: flex; align-items: center; gap: 0.3rem; }
  </style>
</head>
<body class="lab-page">

<nav class="navbar lab-navbar">
  <a class="navbar-brand" href="../index.html">
    <i data-lucide="flask-conical"></i> EdgeSec Lab
  </a>
  <div class="navbar-links">
    <a href="index.html">
      <i data-lucide="layout-grid"></i> 實驗控制台
    </a>
    <a href="analytics.html">
      <i data-lucide="bar-chart-2"></i> 分析儀表板
    </a>
  </div>
</nav>

<div class="run-banner" id="run-banner">
  <span class="run-banner-title" id="banner-scenario">載入中…</span>
  <span class="banner-sep">·</span>
  <span id="banner-tier">Falco Tier: —</span>
  <span class="banner-sep">·</span>
  <span id="banner-type">Exploit</span>
  <span class="banner-sep">·</span>
  <span id="banner-progress">等待執行…</span>
  <span id="banner-spinner" class="spinner" style="display:none;margin-left:4px"></span>
</div>

<div class="page">
  <h1><i data-lucide="flask-conical" style="width:18px;height:18px;vertical-align:middle;margin-right:6px"></i><span id="scenario-title">實驗執行紀錄</span></h1>
  <div class="run-meta">
    run id: <span id="run-id">—</span> ·
    狀態：<span id="run-status">連線中…</span>
  </div>

  <div class="layout">
    <div>
      <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
        <span><i data-lucide="scroll" style="width:14px;height:14px;vertical-align:middle;margin-right:4px"></i> 執行步驟</span>
        <span class="steps-count" id="steps-count"></span>
      </div>
      <div id="steps"><p class="empty-hint">等待第一個步驟…</p></div>

      <div class="result-box" id="result-box">
        <div class="result-row"><span class="label">status</span><span id="result-status"></span></div>
        <div class="result-row"><span class="label">final_privilege</span><span id="result-privilege"></span></div>
        <div class="result-row"><span class="label">flag_found</span><span class="flag-val" id="result-flag"></span></div>
        <div class="result-row"><span class="label">duration_ms</span><span id="result-duration"></span></div>
      </div>
    </div>

    <div>
      <div class="section-title"><i data-lucide="shield-alert" style="width:14px;height:14px;vertical-align:middle;margin-right:4px"></i> Falco 告警（即時）</div>
      <div id="alerts"><p class="empty-hint">尚無告警</p></div>
    </div>
  </div>

  <div class="result-summary card" id="result-summary" style="display:none">
    <h3><i data-lucide="clipboard-check" style="width:16px;height:16px;vertical-align:middle;margin-right:6px"></i>實驗結果摘要</h3>
    <div class="result-grid" id="result-grid">
      <div class="result-item" id="rs-flag">
        <span class="ri-label">FLAG</span>
        <span class="ri-value">—</span>
      </div>
      <div class="result-item" id="rs-detection">
        <span class="ri-label">Falco 偵測</span>
        <span class="ri-value">—</span>
      </div>
      <div class="result-item" id="rs-latency">
        <span class="ri-label">偵測延遲</span>
        <span class="ri-value">—</span>
      </div>
      <div class="result-item" id="rs-alerts">
        <span class="ri-label">告警數</span>
        <span class="ri-value">—</span>
      </div>
    </div>
    <div class="result-actions">
      <button class="btn btn-lab" id="rs-rerun">
        <i data-lucide="rotate-ccw"></i> 再跑一次
      </button>
      <a class="btn btn-lab-primary" id="rs-analytics" href="analytics.html" target="_blank">
        <i data-lucide="bar-chart-2"></i> 查看完整分析
      </a>
      <a class="btn btn-ghost" href="index.html">
        <i data-lucide="layout-grid"></i> 回到場景目錄
      </a>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="../js/api.js"></script>
<script>
const params = new URLSearchParams(location.search);
const runId = params.get('id');
document.getElementById('run-id').textContent = runId || '（缺少 ?id=）';

const statusEl = document.getElementById('run-status');
const stepsEl = document.getElementById('steps');
const alertsEl = document.getElementById('alerts');
const resultBox = document.getElementById('result-box');

let stepsRendered = 0;
let alertsRendered = 0;
let _currentScenarioId = null;
let _collectedAlerts = [];
let _runStartTime = null;

function setStatus(status) {
  statusEl.textContent = status;
  statusEl.className = `status-${status}`;
}

function traceSection(trace) {
  if (!trace) return '';
  const groups = [
    ['執行的程式（execve）', trace.execs],
    ['開啟的檔案（openat）', trace.files],
    ['建立的連線（connect）', trace.connects],
  ].filter(([, items]) => items && items.length);
  if (!groups.length) return '';

  const body = groups.map(([label, items]) => `
    <div><strong>${label}</strong></div>
    <ul>${items.map((i) => `<li>${escapeHtml(i)}</li>`).join('')}</ul>
  `).join('');

  return `
    <details class="step-trace">
      <summary>strace ground truth（與右側 Falco 告警對照）</summary>
      ${body}
    </details>
  `;
}

function addStep(step) {
  if (stepsRendered === 0) stepsEl.innerHTML = '';
  stepsRendered++;

  const ok = step.exit_code === 0;
  const icon = ok
    ? `<span class="step-icon" style="color:var(--green)">✓</span>`
    : `<span class="step-icon" style="color:var(--red)">✕</span>`;
  const stateClass = ok ? 'step-done-ok' : 'step-done-bad';

  const div = document.createElement('div');
  div.className = `step ${stateClass}`;
  div.innerHTML = `
    <div class="step-head">
      <span class="step-num">${step.index}</span>
      ${icon}
      <span class="step-name">${escapeHtml(step.name)}</span>
      <span class="step-duration">${step.duration_ms} ms</span>
    </div>
    ${step.output ? `<pre>${escapeHtml(step.output)}</pre>` : ''}
    ${traceSection(step.trace)}
  `;
  stepsEl.appendChild(div);

  const countEl = document.getElementById('steps-count');
  if (countEl) countEl.textContent = `${stepsRendered} 步驟`;
  document.getElementById('banner-progress').textContent = `步驟 ${stepsRendered} 執行中`;
}

function addAlert(alert) {
  _collectedAlerts.push(alert);
  if (alertsRendered === 0) alertsEl.innerHTML = '';
  alertsRendered++;

  const pri = (alert.priority || '').toLowerCase();
  const sevClass = pri.includes('crit') || pri.includes('error') ? 'sev-critical'
    : pri.includes('warn') ? 'sev-warning'
    : pri.includes('notice') ? 'sev-notice'
    : 'sev-info';
  const sevLabel = pri ? pri.toUpperCase() : 'WARNING';

  const elapsed = _runStartTime
    ? `+${((Date.now() - _runStartTime) / 1000).toFixed(1)}s`
    : '';

  const div = document.createElement('div');
  div.className = `alert-item ${sevClass}`;
  div.innerHTML = `
    <div class="alert-header">
      <span class="alert-rule">${escapeHtml(alert.rule || '(unknown rule)')}</span>
      <span class="alert-time">${elapsed}</span>
    </div>
    <span class="alert-sev">${sevLabel}</span>
    <div class="alert-output">${escapeHtml((alert.output || '').slice(0, 200))}</div>
  `;
  alertsEl.prepend(div);
}

function setResult(result) {
  setStatus(result.status);
  document.getElementById('result-status').textContent = result.status;
  document.getElementById('result-status').className = `status-${result.status}`;
  document.getElementById('result-privilege').textContent = result.final_privilege || '—';
  document.getElementById('result-flag').textContent = result.flag_found || '—';
  document.getElementById('result-duration').textContent = result.duration_ms != null ? `${result.duration_ms} ms` : '—';
  resultBox.classList.add('show');

  if (result.scenario_id) {
    _currentScenarioId = result.scenario_id;
    document.getElementById('scenario-title').textContent = result.scenario_id;
  }

  // Update banner
  document.getElementById('banner-spinner').style.display = 'none';
  document.getElementById('banner-progress').textContent = '已完成';

  // Build result summary using collected data
  const runData = Object.assign({}, result, { alerts: _collectedAlerts });
  showResultSummary(runData, _currentScenarioId || result.scenario_id);
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function initRunBanner(runId) {
  try {
    const run = await apiFetch(`/lab/runs/${encodeURIComponent(runId)}`);
    if (run.scenario_id) {
      _currentScenarioId = run.scenario_id;
      const scenarios = await apiFetch('/lab/scenarios').catch(() => []);
      const scenario = scenarios.find(s => s.id === run.scenario_id);
      document.getElementById('banner-scenario').textContent =
        scenario ? `${run.scenario_id}：${scenario.title}` : run.scenario_id;
    }
    if (run.falco_tier) {
      document.getElementById('banner-tier').textContent =
        `Tier: ${run.falco_tier === 'basic' ? 'Basic (8 規則)' : 'Full (31 規則)'}`;
    }
    if (run.type === 'baseline') {
      document.getElementById('banner-type').textContent = 'Baseline';
    }
  } catch (e) { /* silent */ }
}

function showResultSummary(run, scenarioId) {
  const summary = document.getElementById('result-summary');

  // FLAG
  const flagEl = document.querySelector('#rs-flag .ri-value');
  if (run.flag_found) {
    flagEl.innerHTML = `<i data-lucide="check-circle" style="color:var(--green);width:16px;height:16px"></i> ${run.flag_found}`;
  } else {
    flagEl.innerHTML = `<i data-lucide="x-circle" style="color:var(--red);width:16px;height:16px"></i> 未取得`;
  }

  // Detection
  const detEl = document.querySelector('#rs-detection .ri-value');
  const alertCount = (run.alerts || _collectedAlerts).length;
  const coverage = run.rule_coverage != null ? Math.round(run.rule_coverage * 100) + '%' : null;
  detEl.innerHTML = alertCount > 0
    ? `<i data-lucide="radar" style="color:var(--lab-brand,#4a9eff);width:16px;height:16px"></i> ${alertCount} 筆告警${coverage ? `，覆蓋 ${coverage}` : ''}`
    : `<i data-lucide="eye-off" style="color:var(--text-muted);width:16px;height:16px"></i> 未偵測到`;

  // Latency
  const latEl = document.querySelector('#rs-latency .ri-value');
  if (run.avg_detection_latency_ms != null) {
    const ms = run.avg_detection_latency_ms;
    latEl.textContent = ms >= 1000 ? `${(ms/1000).toFixed(1)} s` : `${ms} ms`;
  } else {
    latEl.textContent = '—';
  }

  // Alert count
  document.querySelector('#rs-alerts .ri-value').textContent = alertCount + ' 筆';

  // Analytics link
  if (scenarioId) {
    document.getElementById('rs-analytics').href = `analytics.html#${scenarioId}`;
  }

  // Rerun button
  document.getElementById('rs-rerun').addEventListener('click', async () => {
    if (!scenarioId) return;
    const btn = document.getElementById('rs-rerun');
    btn.disabled = true;
    try {
      const newRun = await apiFetch('/lab/runs', {
        method: 'POST',
        body: JSON.stringify({ scenario_id: scenarioId }),
      });
      window.location.href = `run.html?id=${encodeURIComponent(newRun.id)}`;
    } catch (e) {
      toast(`執行失敗：${e.message}`, 'error');
      btn.disabled = false;
    }
  });

  summary.style.display = 'block';
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

if (runId) {
  initRunBanner(runId);

  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${protocol}//${location.host}/api/lab/runs/${encodeURIComponent(runId)}/stream`);

  ws.addEventListener('message', (ev) => {
    const msg = JSON.parse(ev.data);
    switch (msg.type) {
      case 'status':
        setStatus(msg.status);
        if (msg.status === 'running') {
          _runStartTime = Date.now();
          document.getElementById('banner-spinner').style.display = 'inline-block';
          document.getElementById('banner-progress').textContent = '執行中…';
        }
        break;
      case 'step': addStep(msg); break;
      case 'result': setResult(msg); break;
      case 'alert': addAlert(msg.alert); break;
      case 'error':
        setStatus('error');
        document.getElementById('banner-spinner').style.display = 'none';
        document.getElementById('banner-progress').textContent = '錯誤';
        toast(`連線錯誤：${msg.error}`, 'error');
        break;
    }
  });

  ws.addEventListener('close', () => {
    if (!resultBox.classList.contains('show') && statusEl.textContent !== 'error') {
      statusEl.textContent += '（連線已關閉）';
    }
  });

  ws.addEventListener('error', () => {
    toast('WebSocket 連線失敗', 'error');
  });
} else {
  setStatus('error');
}
</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
