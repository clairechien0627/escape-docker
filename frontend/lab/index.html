<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edge Container Security Lab — Escape Docker</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .page { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.4rem; color: var(--green); margin-bottom: 0.25rem; }
    .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .section-title { font-size: 1rem; font-weight: 700; color: var(--text-main); margin: 1.5rem 0 0.75rem; }

    .scenario-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.85rem;
    }
    .scenario-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .scenario-card h3 { font-size: 0.95rem; color: var(--text-main); }
    .scenario-id { font-size: 0.7rem; color: var(--text-muted); font-family: var(--font-mono); }
    .scenario-outcome { font-size: 0.78rem; color: var(--text-dim); flex-grow: 1; }
    .scenario-refs { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .scenario-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }

    .toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .toolbar .hint { font-size: 0.78rem; color: var(--text-dim); margin-right: auto; }

    .scenario-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      font-size: 0.7rem;
      color: var(--text-dim);
    }
    .scenario-stats .stat-pill {
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      white-space: nowrap;
    }
    .scenario-stats .stat-pill.good { color: var(--green); border-color: var(--green); }
    .scenario-stats .stat-pill.mid  { color: var(--yellow); border-color: var(--yellow); }
    .scenario-stats .stat-pill.bad  { color: var(--red); border-color: var(--red); }

    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { text-align:left; padding: 0.4rem 0.6rem; font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); border-bottom:1px solid var(--border); }
    td { padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--bg-hover); }
    tr:hover td { background: var(--bg-hover); }
    .status-success { color: var(--green); }
    .status-failed, .status-error, .status-timeout { color: var(--red); }
    .status-running, .status-starting { color: var(--blue); }
    .flag-val { font-size: 0.7rem; color: var(--cyan); font-family: monospace; }
  </style>
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" href="../index.html">🐳 Escape Docker</a>
  <div class="navbar-links">
    <a href="../map.html">🗺️ Map</a>
    <a href="../scoreboard.html">📊 Score</a>
    <a href="../achievements.html">🏆 成就</a>
    <a href="index.html" class="active">🧪 Lab</a>
    <a href="analytics.html">📈 分析</a>
  </div>
</nav>

<div class="page">
  <h1>🧪 Edge Container Security Lab</h1>
  <p class="subtitle">每個情境模擬一種容器逃逸／提權手法：選擇情境並執行，即可即時觀察攻擊腳本的每一步，以及對應的 Falco 告警。</p>

  <div class="toolbar">
    <span class="hint">批次操作會依序對 15 個場景執行，期間請勿關閉此頁面</span>
    <span id="tier-status" class="badge badge-dim" title="目前記錄的 Falco 規則 tier；切換後需手動以對應旗標重啟 escape-falco 容器使規則生效" style="align-self:center;cursor:default">⏳ Tier 載入中</span>
    <button class="btn" id="switch-tier-btn" title="記錄目前 Falco 啟用的規則 tier，供後續執行的 run 標記使用">切換 Tier</button>
    <span id="bulk-progress" class="dim-cell" style="font-size: 0.78rem; align-self: center;"></span>
    <button class="btn" id="run-all-baselines-btn" title="依序對 15 個場景各執行一次 20 秒的 Baseline（不執行攻擊，只收集 Falco 告警），用於計算誤報率（false_positive_rate），結果可在「📈 分析」頁查看">🔬 執行全部 Baseline (15×20s)</button>
    <a class="btn btn-primary" href="batch-run.html" title="開啟即時批次執行頁面，每個場景的步驟與 Falco 告警即時顯示">▶ 執行全部場景 (15)</a>
  </div>

  <div class="section-title">📋 場景目錄</div>
  <div class="scenario-grid" id="scenario-grid">
    <p class="text-dim">載入中…</p>
  </div>

  <div class="section-title">🕓 執行歷史</div>
  <div class="card">
    <table id="runs-table">
      <thead>
        <tr><th>場景</th><th>Tier / 類型</th><th>狀態</th><th>FLAG</th><th>耗時</th><th>開始時間</th><th></th></tr>
      </thead>
      <tbody><tr><td colspan="6" class="text-dim">載入中…</td></tr></tbody>
    </table>
  </div>
</div>

<div id="toast-container"></div>
<script src="../js/api.js"></script>
<script>
function pct(rate) {
  return rate == null ? null : Math.round(rate * 100);
}

function pillClass(p, { invert = false } = {}) {
  if (p == null) return '';
  const good = invert ? p <= 20 : p >= 70;
  const bad = invert ? p >= 60 : p < 30;
  if (good) return 'good';
  if (bad) return 'bad';
  return 'mid';
}

function formatLatencyShort(ms) {
  if (ms == null) return '—';
  return ms >= 1000 ? `${(ms / 1000).toFixed(1)}s` : `${ms}ms`;
}

// 場景卡片下方的「上次結果」摘要：來自 GET /lab/analytics/detection-matrix，
// 讓使用者不用切到「📈 分析」頁就能看出哪些場景已經跑過、偵測效果如何。
function statsRow(m) {
  if (!m || m.runs === 0) {
    return '<div class="scenario-stats dim-cell">尚未執行過</div>';
  }
  const detection = pct(m.detection_rate);
  const coverage = pct(m.rule_coverage);
  const fp = pct(m.false_positive_rate);
  const parts = [
    `<span class="stat-pill" title="執行次數">▶ ${m.runs} 次</span>`,
    `<span class="stat-pill ${pillClass(detection)}" title="Falco 偵測率：該次執行期間是否收到任一告警">🛰 偵測 ${detection == null ? '—' : detection + '%'}</span>`,
    `<span class="stat-pill ${pillClass(coverage)}" title="規則覆蓋率：falco_rule_refs 中實際被命中的比例">📐 覆蓋 ${coverage == null ? '—' : coverage + '%'}</span>`,
    `<span class="stat-pill" title="偵測延遲：從發起執行到第一筆對應告警送達的時間">⏱ ${formatLatencyShort(m.avg_detection_latency_ms)}</span>`,
    `<span class="stat-pill ${pillClass(fp, { invert: true })}" title="誤報率：${m.baseline_runs ? `${m.false_positive_rules.join('、') || '無誤報規則'}（已跑 ${m.baseline_runs} 次 Baseline）` : '尚未執行過 Baseline'}">⚠ 誤報 ${fp == null ? '—' : fp + '%'}</span>`,
  ];
  return `<div class="scenario-stats">${parts.join('')}</div>`;
}

async function loadScenarios() {
  const grid = document.getElementById('scenario-grid');
  try {
    const [scenarios, matrix] = await Promise.all([
      apiFetch('/lab/scenarios'),
      apiFetch('/lab/analytics/detection-matrix').catch(() => []),
    ]);
    const matrixById = new Map(matrix.map((m) => [m.scenario_id, m]));

    grid.innerHTML = scenarios.map((s) => `
      <div class="scenario-card">
        <div class="scenario-id">${s.id} · ${s.container}</div>
        <h3>${s.title}</h3>
        <div class="scenario-refs">
          <span class="badge badge-blue">${s.vuln_type}</span>
          ${(s.falco_rule_refs || []).map((r) => `<span class="badge badge-dim">${r}</span>`).join('')}
        </div>
        <div class="scenario-outcome">${s.expected_outcome}</div>
        ${statsRow(matrixById.get(s.id))}
        <div class="scenario-actions">
          <button class="btn baseline-btn" data-scenario-id="${s.id}" title="不執行攻擊，靜置 20 秒收集 Falco 告警，用於計算誤報率（false_positive_rate）">🔬 Baseline (20s)</button>
          <button class="btn btn-primary run-btn" data-scenario-id="${s.id}">▶ 執行</button>
        </div>
      </div>
    `).join('');
    grid.querySelectorAll('.run-btn').forEach((btn) => {
      btn.addEventListener('click', () => runScenario(btn.dataset.scenarioId, btn));
    });
    grid.querySelectorAll('.baseline-btn').forEach((btn) => {
      btn.addEventListener('click', () => runBaseline(btn.dataset.scenarioId, btn));
    });
  } catch (e) {
    grid.innerHTML = `<p class="text-red">載入場景失敗：${e.message}</p>`;
  }
}

async function runScenario(scenarioId, btn) {
  btn.disabled = true;
  btn.textContent = '啟動中…';
  try {
    const run = await apiFetch('/lab/runs', {
      method: 'POST',
      body: JSON.stringify({ scenario_id: scenarioId }),
    });
    window.location.href = `run.html?id=${encodeURIComponent(run.id)}`;
  } catch (e) {
    toast(`執行失敗：${e.message}`, 'error');
    btn.disabled = false;
    btn.textContent = '▶ 執行';
  }
}

async function runBaseline(scenarioId, btn) {
  btn.disabled = true;
  btn.textContent = '啟動中…';
  try {
    const run = await apiFetch('/lab/baseline-runs', {
      method: 'POST',
      body: JSON.stringify({ scenario_id: scenarioId }),
    });
    window.location.href = `run.html?id=${encodeURIComponent(run.id)}`;
  } catch (e) {
    toast(`Baseline 執行失敗：${e.message}`, 'error');
    btn.disabled = false;
    btn.textContent = '🔬 Baseline (20s)';
  }
}

async function waitForRunCompletion(runId) {
  while (true) {
    const run = await apiFetch(`/lab/runs/${encodeURIComponent(runId)}`);
    if (run.status && run.status !== 'starting' && run.status !== 'running') return run;
    await new Promise((resolve) => setTimeout(resolve, 2000));
  }
}

async function runAllSequentially({ button, otherButton, progress, endpoint, label, confirmMsg, doneMsg }) {
  if (!window.confirm(confirmMsg)) return;
  button.disabled = true;
  otherButton.disabled = true;
  try {
    const scenarios = await apiFetch('/lab/scenarios');
    for (let i = 0; i < scenarios.length; i++) {
      const s = scenarios[i];
      progress.textContent = `(${i + 1}/${scenarios.length}) ${s.id} ${label}…`;
      const run = await apiFetch(endpoint, {
        method: 'POST',
        body: JSON.stringify({ scenario_id: s.id }),
      });
      await waitForRunCompletion(run.id);
    }
    progress.textContent = doneMsg;
    toast(doneMsg, 'success');
    loadScenarios();
    loadRuns();
  } catch (e) {
    toast(`執行失敗：${e.message}`, 'error');
    progress.textContent = '';
  } finally {
    button.disabled = false;
    otherButton.disabled = false;
  }
}

document.getElementById('run-all-baselines-btn').addEventListener('click', () => {
  const btn = document.getElementById('run-all-baselines-btn');
  runAllSequentially({
    button: btn,
    otherButton: btn,
    progress: document.getElementById('bulk-progress'),
    endpoint: '/lab/baseline-runs',
    label: 'baseline 執行中',
    confirmMsg: '將依序對 15 個場景各執行一次 20 秒的 Baseline（不執行攻擊，只收集 Falco 告警），全部約需數分鐘，期間請勿關閉此頁面。是否繼續？',
    doneMsg: '15 個場景的 Baseline 已全部執行完成',
  });
});

function statusLabel(status) {
  const map = {
    success: '✅ success', failed: '❌ failed', error: '⚠️ error',
    timeout: '⏱️ timeout', running: '🔵 running', starting: '🔵 starting',
  };
  return map[status] || status || '—';
}

async function loadRuns() {
  const tbody = document.querySelector('#runs-table tbody');
  try {
    const runs = await apiFetch('/lab/runs');
    if (runs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-dim">尚無執行紀錄</td></tr>';
      return;
    }
    function tierTypeCell(r) {
      const isBaseline = r.type === 'baseline';
      const t = r.falco_tier;
      const tierPart = t === 'basic'
        ? '<span style="color:#60c8ff;font-size:0.7rem">🔵 Basic</span>'
        : t === 'full'
          ? '<span style="color:var(--green);font-size:0.7rem">🟢 Full</span>'
          : '<span style="color:var(--text-muted);font-size:0.7rem">—</span>';
      const typePart = isBaseline
        ? '<span style="color:var(--text-muted);font-size:0.7rem"> 🔬</span>'
        : '';
      return tierPart + typePart;
    }
    tbody.innerHTML = runs.slice(0, 30).map((r) => `
      <tr>
        <td>${r.scenario_id}</td>
        <td>${tierTypeCell(r)}</td>
        <td class="status-${r.status}">${statusLabel(r.status)}</td>
        <td class="flag-val">${r.flag_found || '—'}</td>
        <td>${r.duration_ms != null ? r.duration_ms + ' ms' : '—'}</td>
        <td style="font-size:0.72rem;color:var(--text-dim)">${r.started_at ? new Date(r.started_at).toLocaleString() : '—'}</td>
        <td><a href="run.html?id=${encodeURIComponent(r.id)}">查看</a></td>
      </tr>
    `).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-red">載入失敗：${e.message}</td></tr>`;
  }
}

async function loadTierStatus() {
  const badge = document.getElementById('tier-status');
  try {
    const { tier } = await apiFetch('/lab/falco-tier');
    badge.textContent = tier === 'basic' ? '🔵 Basic Tier (8 規則)' : '🟢 Full Tier (31 規則)';
    badge.className = 'badge';
    badge.style.cssText = tier === 'basic'
      ? 'align-self:center;cursor:default;border-color:#60c8ff;color:#60c8ff'
      : 'align-self:center;cursor:default;border-color:var(--green);color:var(--green)';
  } catch {
    badge.textContent = '⚠ Tier 未知';
    badge.className = 'badge';
    badge.style.cssText = 'align-self:center;cursor:default;border-color:var(--red);color:var(--red)';
  }
}

document.getElementById('switch-tier-btn').addEventListener('click', async () => {
  const badge = document.getElementById('tier-status');
  const isBasic = badge.textContent.includes('Basic');
  const nextTier = isBasic ? 'full' : 'basic';
  const nextLabel = nextTier === 'basic' ? 'Basic Tier（8 條核心規則）' : 'Full Tier（31 條規則）';
  if (!window.confirm(`切換至 ${nextLabel}？\n\nFalco 容器將自動重啟（約 5-10 秒），期間告警暫停，重啟完成後立即生效。`)) return;
  const btn = document.getElementById('switch-tier-btn');
  btn.disabled = true;
  btn.textContent = '重啟中…';
  try {
    const result = await apiFetch('/lab/falco-tier', { method: 'POST', body: JSON.stringify({ tier: nextTier }) });
    loadTierStatus();
    if (result.restarted) {
      toast(`已切換至 ${nextLabel}，Falco 已自動重啟完成。`, 'success');
    } else {
      toast(`已記錄 ${nextLabel}，但 Falco 重啟失敗：${result.restart_error || '未知'}。請手動執行 docker restart escape-falco。`, 'error');
    }
  } catch (e) {
    toast(`切換失敗：${e.message}`, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '切換 Tier';
  }
});

loadScenarios();
loadRuns();
loadTierStatus();
setInterval(loadRuns, 10000);
</script>
</body>
</html>
