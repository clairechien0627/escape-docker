events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # ── 靜態前端 ──
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ $uri.html /index.html;
        }

        # ── Scoreboard API ──
        location /api/ {
            set $upstream scoreboard-api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Room Manager（房間狀態 / 啟停 / 重置）──
        # /api/rooms/status        -> room-manager:/status
        # /api/rooms/<id>/ensure   -> room-manager:/rooms/<id>/ensure（reset、heartbeat、release 同理）
        location = /api/rooms/status {
            set $upstream room-manager:4000;
            rewrite ^ /status break;
            proxy_pass         http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location ~ ^/api/rooms/(.+)$ {
            set $upstream room-manager:4000;
            rewrite ^/api/rooms/(.+)$ /rooms/$1 break;
            proxy_pass         http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Lab API：執行進度即時串流（WebSocket，須先於下方一般 /api/lab/ 規則）──
        location ~ ^/api/lab/runs/[^/]+/stream$ {
            set $upstream lab-api:4100;
            proxy_pass         http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Lab API（Edge Container Security Lab：場景目錄 / 執行 / 結果）──
        location /api/lab/ {
            set $upstream lab-api:4100;
            proxy_pass         http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── WebSocket Terminal Gateway ──
        location /ws {
            set $upstream terminal-gateway:3001;
            proxy_pass         http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
