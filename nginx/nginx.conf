events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream scoreboard_api {
        server scoreboard-api:8000;
    }

    upstream terminal_gw {
        server terminal-gateway:3001;
    }

    upstream room_manager {
        server room-manager:4000;
    }

    upstream lab_api {
        server lab-api:4100;
    }

    server {
        listen 80;
        server_name localhost;

        # ── 靜態前端 ──
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ $uri.html /index.html;
        }

        # ── Scoreboard API ──
        location /api/ {
            proxy_pass         http://scoreboard_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Room Manager（房間狀態 / 啟停 / 重置）──
        # /api/rooms/status        -> room-manager:/status
        # /api/rooms/<id>/ensure   -> room-manager:/rooms/<id>/ensure（reset、heartbeat、release 同理）
        location = /api/rooms/status {
            proxy_pass         http://room_manager/status;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location ~ ^/api/rooms/(.+)$ {
            proxy_pass         http://room_manager/rooms/$1;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Lab API：執行進度即時串流（WebSocket，須先於下方一般 /api/lab/ 規則）──
        location ~ ^/api/lab/runs/[^/]+/stream$ {
            proxy_pass         http://lab_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Lab API（Edge Container Security Lab：場景目錄 / 執行 / 結果）──
        location /api/lab/ {
            proxy_pass         http://lab_api/api/lab/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── WebSocket Terminal Gateway ──
        location /ws {
            proxy_pass         http://terminal_gw;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
