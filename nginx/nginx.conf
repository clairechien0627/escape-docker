events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream scoreboard_api {
        server scoreboard-api:8000;
    }

    upstream terminal_gw {
        server terminal-gateway:3001;
    }

    upstream room_manager {
        server room-manager:4000;
    }

    server {
        listen 80;
        server_name localhost;

        # ── 靜態前端 ──
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ $uri.html /index.html;
        }

        # ── Scoreboard API ──
        location /api/ {
            proxy_pass         http://scoreboard_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Room Manager（房間狀態 / 啟停 / 重置）──
        location /api/rooms/ {
            proxy_pass         http://room_manager/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── WebSocket Terminal Gateway ──
        location /ws {
            proxy_pass         http://terminal_gw;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
